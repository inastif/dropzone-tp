# nginx configuration of the front image (provided, nothing to change here).
# - serves the production build of the React app (npm run build -> dist/)
#   from /usr/share/nginx/html;
# - listens on port 8080 (no root privileges needed for a port above 1024);
# - forwards /api/ to the service named "api", port 8000 (same origin: no CORS).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API is reachable on the same origin: no CORS needed.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets never change: cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths are handled by React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
