name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Le jeton du workflow n'a besoin que de lire le code.
permissions:
  contents: read

# Un nouveau push sur la même branche annule le run précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Ruff (lint et format)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          ruff format --check .

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ESLint et TypeScript
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck

  backend-tests:
    name: Tests backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest avec la couverture
        run: pytest

  frontend-tests:
    name: Tests frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vitest
        run: npm test
      - name: Build de production
        run: npm run build

  e2e:
    name: E2E
    # Seulement si les trois autres jobs sont verts.
    needs: [lint, backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Démarrer la stack Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          # L'API n'a pas encore de healthcheck : on attend qu'elle réponde.
          curl --retry 15 --retry-delay 2 --retry-all-errors -fsS http://localhost:8000/health/ready

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer Playwright et Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Tests Playwright
        working-directory: frontend
        run: npm run test:e2e

      - name: Garder le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Logs de la stack en cas d'échec
        if: ${{ failure() }}
        run: docker compose logs

      - name: Arrêter la stack
        if: ${{ always() }}
        run: docker compose down -v
